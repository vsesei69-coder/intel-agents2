<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neitis Trading Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Consolas,monospace;background:#0d1117;color:#c9d1d9;display:flex;height:100vh}
/* === LEFT PANEL === */
#panel{width:380px;min-width:380px;background:#161b22;border-right:1px solid #30363d;overflow-y:auto;padding:12px}
#panel h1{font-size:16px;color:#58a6ff;margin-bottom:4px}
#panel .ts{font-size:11px;color:#8b949e;margin-bottom:12px}
.agent{margin-bottom:10px;padding:8px;border:1px solid #21262d;border-radius:6px;cursor:pointer;transition:all .15s}
.agent:hover{border-color:#58a6ff}
.agent.active{border-color:#3fb950;background:#1a2e1a}
.agent .name{font-size:13px;font-weight:bold}
.agent .name .badge{font-size:10px;padding:2px 6px;border-radius:3px;margin-left:6px}
.badge.win{background:#1a3a1a;color:#3fb950}
.badge.loss{background:#3a1a1a;color:#f85149}
.agent .stats{font-size:11px;color:#8b949e;margin-top:4px}
.grid-row{font-size:10px;padding:3px 0;border-bottom:1px solid #21262d;display:flex;justify-content:space-between}
.grid-row .sym{color:#58a6ff}
.grid-row .lev{color:#ffa657}
.grid-row .levels{color:#8b949e}
.total{font-size:14px;margin-top:8px;padding:6px;background:#21262d;border-radius:4px}
.total .pos{color:#3fb950}
.total .neg{color:#f85149}
/* === MAIN CHART === */
#main{flex:1;display:flex;flex-direction:column}
#chart-header{padding:8px 16px;background:#161b22;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:12px}
#chart-header select{padding:4px 8px;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;font-family:Consolas,monospace;font-size:12px}
#chart-header .price{font-size:18px;font-weight:bold}
#chart-header .price.up{color:#3fb950}
#chart-header .price.dn{color:#f85149}
#chart-header .info{font-size:11px;color:#8b949e}
canvas{flex:1;display:block}
#error{display:none;padding:20px;color:#f85149}
</style>
</head>
<body>

<div id="panel">
  <h1>NEITIS TRADING</h1>
  <div id="ts" class="ts">loading...</div>
  <div id="total" class="total">...</div>
  <div id="agents"></div>
</div>

<div id="main">
  <div id="chart-header">
    <span id="ch-symbol" style="font-weight:bold;color:#58a6ff">--</span>
    <span id="ch-price" class="price">--</span>
    <span id="ch-info" class="info">--</span>
  </div>
  <canvas id="chart"></canvas>
  <div id="error"></div>
</div>

<script>
const API = 'https://status--intel-agents--krq52hqdvwwl.code.run';
const AUTH = 'Basic ' + btoa('ishkin:neitis-status-2026');

let agentsData = {};
let activeSymbols = {};
let selectedSymbol = null;
let priceCache = {};
let chartCanvas, ctx;

function hasOpen(x) { return x && (typeof x.open === 'string' ? parseInt(x.open) : x.open) > 0; }
function pnlColor(v) { return v >= 0 ? 'pos' : 'neg'; }

async function fetchJSON(url) {
  const r = await fetch(url, { headers: { Authorization: AUTH }, signal: AbortSignal.timeout(15000) });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function fetchBinancePrice(symbol) {
  try {
    const r = await fetch(`https://fapi.binance.com/fapi/v1/ticker/price?symbol=${symbol}`, { signal: AbortSignal.timeout(5000) });
    const d = await r.json();
    return parseFloat(d.price);
  } catch(e) { return null; }
}

async function fetchBinanceKlines(symbol, interval='15m', limit=100) {
  try {
    const r = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`, { signal: AbortSignal.timeout(10000) });
    const raw = await r.json();
    return raw.map(k => ({ t: k[0], o: +k[1], h: +k[2], l: +k[3], c: +k[4], v: +k[5] }));
  } catch(e) { return []; }
}

function bb(closes, period=20, std=2.0) {
  if (closes.length < period) return null;
  const slice = closes.slice(-period);
  const sma = slice.reduce((a,b)=>a+b,0)/period;
  const variance = slice.reduce((s,c)=>s+(c-sma)**2,0)/period;
  const stdev = Math.sqrt(variance);
  return { mid: sma, upper: sma + std*stdev, lower: sma - std*stdev };
}

async function refresh() {
  try {
    const status = await fetchJSON(API + '/status');
    document.getElementById('ts').textContent = 'Server: ' + (status.ts || '?');

    // Total PnL
    let totalPnl = 0, totalTrades = 0;
    const agents = status.agents || {};
    const agentKeys = Object.keys(agents).sort();

    let agentsHTML = '';
    const newActive = {};

    for (const name of agentKeys) {
      const a = agents[name];
      if (!a) continue;
      const pnl = parseFloat(a.pnl) || 0;
      const trades = parseInt(a.trades) || 0;
      const wr = parseFloat(a.wr) || 0;
      const open = parseInt(a.open) || 0;

      totalPnl += pnl;
      totalTrades += trades;

      if (open > 0) {
        // Fetch open grids
        try {
          const grids = await fetchJSON(API + '/rawopen/' + name);
          a._grids = grids || [];
          for (const g of grids) {
            if (!newActive[g.symbol]) newActive[g.symbol] = [];
            newActive[g.symbol].push({ agent: name, grid: g });
          }
        } catch(e) { a._grids = []; }
      }

      const active = open > 0 ? 'active' : '';
      const cls = pnlColor(pnl);
      agentsHTML += `
        <div class="agent ${active}" onclick="selectSymbol('${name}')" data-agent="${name}">
          <div class="name">${name}
            <span class="badge ${cls}">$${pnl.toFixed(2)}</span>
            <span class="badge win" style="background:#21262d;color:#8b949e">${trades}t</span>
          </div>
          <div class="stats">WR ${wr.toFixed(0)}% | Open: ${open} | ${a.mtime || ''}</div>
          ${(a._grids||[]).map(g => `
            <div class="grid-row" style="cursor:pointer" onclick="event.stopPropagation();selectSymbol('${g.symbol}')">
              <span class="sym">${g.symbol}</span>
              <span class="lev">${g.leverage||'?'}x</span>
              <span class="levels">${g.levels?g.levels.length:'?'} lvls</span>
            </div>
          `).join('')}
        </div>`;
    }

    document.getElementById('total').innerHTML = `
      TOTAL: <span class="${pnlColor(totalPnl)}">$${totalPnl.toFixed(2)}</span> | Trades: ${totalTrades}
    `;

    document.getElementById('agents').innerHTML = agentsHTML;
    agentsData = agents;
    activeSymbols = newActive;

    // Auto-select first active grid
    const symbols = Object.keys(newActive);
    if (!selectedSymbol && symbols.length > 0) selectSymbol(symbols[0]);

    // Refresh chart if symbol selected
    if (selectedSymbol) drawChart(selectedSymbol);

  } catch(e) {
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = 'API ERROR: ' + e.message;
  }
}

async function selectSymbol(sym) {
  selectedSymbol = sym;
  document.getElementById('ch-symbol').textContent = sym;
  document.getElementById('ch-price').textContent = '...';
  await drawChart(sym);
}

async function drawChart(symbol) {
  chartCanvas = document.getElementById('chart');
  ctx = chartCanvas.getContext('2d');

  const price = await fetchBinancePrice(symbol);
  const priceEl = document.getElementById('ch-price');
  if (price) {
    const prev = priceCache[symbol] || price;
    priceCache[symbol] = price;
    priceEl.textContent = '$' + price.toFixed(price > 1 ? 2 : 6);
    priceEl.className = 'price ' + (price >= prev ? 'up' : 'dn');
  }

  const klines = await fetchBinanceKlines(symbol, '15m', 50);
  if (!klines.length) {
    document.getElementById('ch-info').textContent = 'no data';
    return;
  }

  const closes = klines.map(k => k.c);
  const bbData = bb(closes);
  if (!bbData) return;

  // Find grid info for this symbol
  const grids = activeSymbols[symbol] || [];
  document.getElementById('ch-info').textContent = grids.length + ' agents | BB mid:' + bbData.mid.toFixed(6) + ' upper:' + bbData.upper.toFixed(6) + ' lower:' + bbData.lower.toFixed(6);

  const W = chartCanvas.parentElement.clientWidth - 4;
  const H = chartCanvas.parentElement.clientHeight - 60;
  chartCanvas.width = W;
  chartCanvas.height = H;
  chartCanvas.style.width = W + 'px';
  chartCanvas.style.height = H + 'px';

  const padding = { top: 20, right: 40, bottom: 40, left: 80 };
  const pw = W - padding.left - padding.right;
  const ph = H - padding.top - padding.bottom;

  const prices = [...klines.map(k => k.h), ...klines.map(k => k.l)];
  if (bbData) prices.push(bbData.upper, bbData.lower);
  for (const g of grids) {
    for (const lvl of (g.grid.levels || [])) {
      prices.push(lvl.entry, lvl.tp);
    }
  }
  const minP = Math.min(...prices) * 0.999;
  const maxP = Math.max(...prices) * 1.001;

  const xScale = (i) => padding.left + (i / (klines.length - 1)) * pw;
  const yScale = (p) => padding.top + ph - ((p - minP) / (maxP - minP)) * ph;

  // Clear
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = '#21262d';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < 5; i++) {
    const y = padding.top + (ph * i / 4);
    ctx.beginPath(); ctx.moveTo(padding.left, y); ctx.lineTo(W - padding.right, y); ctx.stroke();
    const p = maxP - (maxP - minP) * i / 4;
    ctx.fillStyle = '#8b949e';
    ctx.font = '9px Consolas';
    ctx.fillText(p.toFixed(price > 1 ? 2 : 6), W - padding.right + 4, y + 3);
  }

  // BB bands
  ctx.strokeStyle = 'rgba(88,166,255,0.3)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(xScale(0), yScale(bbData.upper));
  ctx.lineTo(xScale(klines.length-1), yScale(bbData.upper));
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(xScale(0), yScale(bbData.lower));
  ctx.lineTo(xScale(klines.length-1), yScale(bbData.lower));
  ctx.stroke();
  ctx.setLineDash([]);

  // BB mid
  ctx.strokeStyle = 'rgba(88,166,255,0.6)';
  ctx.lineWidth = 1;
  ctx.setLineDash([2, 6]);
  ctx.beginPath();
  ctx.moveTo(xScale(0), yScale(bbData.mid));
  ctx.lineTo(xScale(klines.length-1), yScale(bbData.mid));
  ctx.stroke();
  ctx.setLineDash([]);

  // Candlesticks
  const candleWidth = Math.max(2, pw / klines.length * 0.7);
  for (let i = 0; i < klines.length; i++) {
    const k = klines[i];
    const x = xScale(i);
    const isGreen = k.c >= k.o;
    ctx.strokeStyle = isGreen ? '#3fb950' : '#f85149';
    ctx.fillStyle = isGreen ? '#3fb950' : '#f85149';
    ctx.lineWidth = 1;

    // Wick
    ctx.beginPath();
    ctx.moveTo(x, yScale(k.h));
    ctx.lineTo(x, yScale(k.l));
    ctx.stroke();

    // Body
    const bodyH = Math.abs(yScale(k.o) - yScale(k.c));
    const bodyY = isGreen ? yScale(k.c) : yScale(k.o);
    ctx.fillRect(x - candleWidth/2, bodyY, candleWidth, Math.max(1, bodyH));
  }

  // Current price line
  if (price) {
    ctx.strokeStyle = '#ffa657';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(padding.left, yScale(price));
    ctx.lineTo(W - padding.right, yScale(price));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ffa657';
    ctx.fillText(price.toFixed(price > 1 ? 2 : 6), W - padding.right - 80, yScale(price) - 4);
  }

  // Grid levels
  for (const g of grids) {
    const levels = g.grid.levels || [];
    for (const lvl of levels) {
      const y = yScale(lvl.entry);
      const filled = lvl.filled;
      const tpY = yScale(lvl.tp);

      // Entry line
      ctx.strokeStyle = filled ? 'rgba(63,185,80,0.6)' : 'rgba(248,81,73,0.3)';
      ctx.lineWidth = filled ? 1.5 : 0.5;
      ctx.beginPath();
      ctx.moveTo(padding.left, y);
      ctx.lineTo(W - padding.right, y);
      ctx.stroke();

      // TP marker
      if (filled && !lvl.tp_hit) {
        ctx.fillStyle = '#3fb950';
        ctx.beginPath();
        ctx.arc(W - padding.right - 30, tpY, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#8b949e';
        ctx.font = '8px Consolas';
        ctx.fillText('TP', W - padding.right - 24, tpY + 3);
      }
    }
  }

  // Time labels
  ctx.fillStyle = '#8b949e';
  ctx.font = '9px Consolas';
  for (let i = 0; i < klines.length; i += 10) {
    const d = new Date(klines[i].t);
    const t = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    ctx.fillText(t, xScale(i) - 15, H - padding.bottom + 15);
  }
}

// Resize handler
window.addEventListener('resize', () => { if (selectedSymbol) drawChart(selectedSymbol); });

// Initial load
refresh();
// Refresh every 60s
setInterval(refresh, 60000);
</script>
</body>
</html>
